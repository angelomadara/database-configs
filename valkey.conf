# ---------------------------------------------------------------------------
# Valkey configuration for the `valkey` service in docker-compose.yml
#
# Loaded as:  valkey-server /usr/local/etc/valkey/valkey.conf
#
# This file contains NO secret and is safe to commit.
#
# Why not CLI flags: `--requirepass <secret>` on the command line ends up in
# argv, and /proc/<pid>/cmdline is world-readable (mode r--r--r--), so any
# local user could read the password with `ps`.
#
# Why the password is not written here either: valkey-server does NOT expand
# environment variables inside a config file. `requirepass ${VALKEY_PASSWORD}`
# is stored as that LITERAL string, i.e. a fixed, publicly-known password.
# Verified on valkey 9.1.2: `config get requirepass` returned
# `${VALKEY_PASSWORD}` verbatim.
#
# So the compose entrypoint copies this file to /run/valkey/valkey.conf at
# startup and appends the real `requirepass` there. That runtime file lives in
# the container only -- never in this repo, the image, or the data volume.
#
# Residual exposure: the password is in the container environment, so
# `docker inspect` shows it. That is readable only by root / docker-group
# members, unlike argv which was world-readable. To remove it entirely, move
# it to a Docker secret and export it from /run/secrets/valkey_password.
# ---------------------------------------------------------------------------

# --- network / auth --------------------------------------------------------
bind * -::*
port 6379
protected-mode yes

# REQUIREPASS IS DELIBERATELY ABSENT.
# The compose entrypoint appends `requirepass "<password>"` to a runtime copy
# of this file (/run/valkey/valkey.conf) after checking that the value is
# non-empty -- so a missing password fails the container closed instead of
# starting an unauthenticated server. Do not add a requirepass line here: it
# would be shadowed, and an empty one means NO AUTH AT ALL.

# 0 keeps idle clients connected forever. Lower it (e.g. 300) only if every
# client reconnects reliably -- connection pools that idle will not.
timeout 0
tcp-keepalive 300

# --- memory ----------------------------------------------------------------
# Sized for this host: 5.8 GiB RAM, 1 vCPU, no swap.
#
# noeviction is deliberate: this instance is a durable store, not a cache, so
# when it fills up writes must fail loudly instead of silently discarding keys.
# Switch to allkeys-lru only if you repurpose it as a cache.
maxmemory 1gb
maxmemory-policy noeviction

# --- persistence -----------------------------------------------------------
# AOF only. The RDB save points that ship as defaults stay ACTIVE unless
# explicitly disabled, which gives you two independent fork-and-write paths
# over the same dataset -- double I/O, and two fork/COW memory spikes.
# Pick one mechanism:
#   * AOF (current): `save ""` below. Best durability granularity.
#   * RDB snapshots: set appendonly to no and configure `save` instead.
save ""

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# One fsync per second: at most ~1s of writes lost, far cheaper than `always`.
appendfsync everysec

# Don't start an AOF rewrite while a background fsync is in flight -- trades a
# little rewrite latency for avoiding fsync stalls.
no-appendfsync-on-rewrite no

# Rewrite at 2x growth, but never for a trivially small AOF.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Named volume mounted by the compose file; matches the image's WORKDIR so the
# entrypoint's chown step covers it.
dir /data

# --- logging ---------------------------------------------------------------
loglevel notice
# Empty logfile == stdout, which is what Docker collects. Container logs are
# size-capped by the `logging:` block in docker-compose.yml.
logfile ""
